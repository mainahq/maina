type: object
required:
  - api_key
  - password
properties:
  api_key:
    type: string
    description: The api_key issued by the provider
  password:
    type: string
  token: string
  secret: ~
  private_key: null
  auth_token: ${{ secrets.AUTH_TOKEN }}
  api-secret: !secret provider_api_secret
  password_hint: ""
  apikey: <your-api-key>
env:
  API_KEY: ${API_KEY}
