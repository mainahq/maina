name: Runtime artifacts

# v1 task 2.3 (FR-INS-1, FR-INS-2, FR-INS-7; ADR 0045): the standalone
# `maina` runtime, one `bun build --compile` executable per OS/arch, and the
# launcher (packages/runtime/launcher) that host plugins run.
#
# - launcher: the launcher tests under a GUI-like PATH on every OS
#   (launch.sh on macOS/Linux, launch.ps1 wherever PowerShell is installed),
#   and the standalone entry's embedded tree-sitter (#526).
# - build: compiles each target on a runner that can run it where one
#   exists, and smoke-tests the executable, including the System 1 engines
#   (#587, ADR 0050): a tiny ONNX model and tokenizer run inside the
#   compiled executable on onnxruntime-web (WASM) on every target it can
#   run, and on the onnxruntime-node addon, loaded by path the way a model
#   release ships it, on the native targets. musl runs in Alpine, darwin-x64
#   under Rosetta when the runner has it.
#
# Signing and publishing moved to the lockstep release (release.yml, v1 task
# 9.7): the runtime ships with the CLI packages and the plugins, at one
# version, in one signed `runtime-v<version>` release.

on:
  pull_request:
    branches: [master, "v1/**"]
    paths:
      - "packages/runtime/**"
      - "packages/cli/src/**"
      - "packages/mcp/src/**"
      - "packages/core/src/**"
      - "bun.lock"
      - ".github/workflows/runtime-artifacts.yml"
  push:
    branches: ["v1/main"]
    paths:
      - "packages/runtime/**"
      - ".github/workflows/runtime-artifacts.yml"
  workflow_dispatch:

concurrency:
  group: runtime-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  launcher:
    name: launcher / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test packages/runtime/launcher packages/runtime/build
      # The compiled executable's embedded tree-sitter (#526) on every OS,
      # in process: the gate and the code graph, without the resident runtime.
      - run: bun test packages/runtime/src/standalone
      # The resident runtime over a named pipe (#564): spawn, IPC and the
      # fail-closed client, which the CI workflow runs on Linux and macOS.
      - if: runner.os == 'Windows'
        run: bun test packages/runtime/src/__tests__/ipc.test.ts packages/runtime/src/__tests__/lifecycle.test.ts packages/runtime/src/__tests__/crash.test.ts

  build:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, smoke: true }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, smoke: true }
          - { target: linux-x64-musl, runner: ubuntu-latest, smoke: false }
          - { target: linux-arm64-musl, runner: ubuntu-24.04-arm, smoke: false }
          - { target: darwin-arm64, runner: macos-latest, smoke: true }
          - { target: darwin-x64, runner: macos-latest, smoke: false }
          - { target: windows-x64, runner: windows-latest, smoke: true }
          - { target: windows-arm64, runner: windows-11-arm, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Compile
        run: bun packages/runtime/build/standalone.ts --out dist/runtime --targets ${{ matrix.target }}
      # A self-test directory laid out like a model release (#587): the tiny
      # model, its tokenizer, onnxruntime-web's .wasm and, on a native
      # target, the onnxruntime-node addon for it. The addon is not a
      # dependency (a model release ships it), so it comes from npm at the
      # version the runtime pins.
      - name: Stage the System 1 engines
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ort=$(bun -p "require('./packages/runtime/package.json').dependencies['onnxruntime-common']")
          lib=$(bun -e 'const { ortNodeDir } = await import("./packages/runtime/src/model/engine.ts"); process.stdout.write(ortNodeDir(process.env.TARGET ?? "") ?? "")')
          mkdir -p dist/ort-node
          if [ -n "$lib" ]; then
            (cd dist/ort-node && tgz=$(npm pack "onnxruntime-node@$ort" --silent) && tar xzf "$tgz" "package/$lib" && rm "$tgz")
            bun packages/runtime/src/model/__tests__/fixtures/tiny-model.ts dist/selftest --target "$TARGET" --native "dist/ort-node/package/$lib"
            # A native path: on Windows, not this shell's /d/...
            root=$(pwd -W 2>/dev/null || pwd)
            echo "MAINA_ORT_NATIVE_DIR=$root/dist/ort-node/package/$lib" >> "$GITHUB_ENV"
          else
            bun packages/runtime/src/model/__tests__/fixtures/tiny-model.ts dist/selftest
          fi
          ls -R dist/selftest
      # One process per file, as `bun run test` does: a process loads one
      # onnxruntime addon, and two files stage it in different directories.
      - name: System 1 engine tests
        if: matrix.smoke
        shell: bash
        run: for f in packages/runtime/src/model/__tests__/*.test.ts; do bun test "$f"; done
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          bin=$(ls dist/runtime/maina-*-${{ matrix.target }}*)
          "$bin" cli --version
          out=$("$bin" hook --host claude PreToolUse </dev/null)
          echo "$out"
          case $out in *'"permissionDecision":"ask"'*) ;; *) echo "hook did not fail closed" >&2; exit 1 ;; esac
          # Codex runs a tool whose PreToolUse hook asks: it must deny, exit 2.
          code=0
          out=$("$bin" hook --host codex PreToolUse </dev/null) || code=$?
          echo "$out"
          case $code:$out in 2:*'"permissionDecision":"deny"'*) ;; *) echo "codex hook did not fail closed" >&2; exit 1 ;; esac
          # The executable embeds tree-sitter (#526): the gate reads a Bash
          # command instead of asking for it as opaque, so wiping the host's
          # config is denied, not asked. The first hook starts the resident
          # runtime and the next ones get their answer from it, not from the
          # in-process fallback, on every OS: on Windows a compiled hook used
          # to spawn no runtime at all (#564).
          # The host sends a native path: on Windows, not this shell's /d/...
          cwd=$(pwd -W 2>/dev/null || pwd)
          input=$(printf '{"session_id":"ci","transcript_path":"%s/t.jsonl","cwd":"%s","hook_event_name":"PreToolUse","permission_mode":"default","tool_name":"Bash","tool_input":{"command":"rm -rf ~/.claude"},"tool_use_id":"toolu_ci"}' "$cwd" "$cwd")
          for attempt in 1 2 3; do
            code=0
            out=$(printf '%s' "$input" | "$bin" hook --host claude PreToolUse) || code=$?
            echo "attempt $attempt: $out"
            case $code:$out in 2:*'"permissionDecision":"deny"'*) ;; *) echo "hook did not deny rm -rf ~/.claude (shell grammar not embedded?)" >&2; exit 1 ;; esac
            if [ "$attempt" -gt 1 ]; then
              case $out in *'runtime unavailable'*) echo "the resident runtime did not answer the hook" >&2; exit 1 ;; esac
            fi
          done
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          # head exits after one line, so the server may die of SIGPIPE: ignore
          # the pipeline status and check the reply instead.
          reply=$( (echo "$init"; sleep 5) | "$bin" mcp | head -n 1 || true)
          echo "$reply"
          case $reply in *'"serverInfo"'*) ;; *) echo "mcp did not answer initialize" >&2; exit 1 ;; esac
          # The System 1 engines inside the executable (#587): WASM on every
          # target, and the native addon from ort/<target>/ where one ships.
          engines=wasm
          if [ -d dist/selftest/ort ]; then engines="wasm native"; fi
          for engine in $engines; do
            out=$("$bin" model-selftest dist/selftest --target ${{ matrix.target }} --engine "$engine")
            echo "$engine: $out"
            case $out in *'"ok":true'*) ;; *) echo "model-selftest ($engine) failed" >&2; exit 1 ;; esac
          done
      # musl: the WASM engine inside the executable, in Alpine (#587).
      - name: Smoke test (musl, System 1 engines)
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -euc '
            apk add --no-cache libstdc++ libgcc >/dev/null
            bin=$(ls dist/runtime/maina-*-${{ matrix.target }})
            out=$("$bin" model-selftest dist/selftest --target ${{ matrix.target }})
            echo "$out"
            case $out in *"\"ok\":true"*) ;; *) echo "model-selftest failed" >&2; exit 1 ;; esac
          '
      # darwin-x64: the WASM engine inside the executable, under Rosetta
      # when the arm64 runner has it (#587).
      - name: Smoke test (darwin-x64 under Rosetta, System 1 engines)
        if: matrix.target == 'darwin-x64'
        shell: bash
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::notice::Rosetta is not installed on this runner; darwin-x64 model-selftest skipped"
            exit 0
          fi
          bin=$(ls dist/runtime/maina-*-darwin-x64)
          out=$("$bin" model-selftest dist/selftest --target darwin-x64)
          echo "$out"
          case $out in *'"ok":true'*) ;; *) echo "model-selftest failed" >&2; exit 1 ;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: dist/runtime/maina-*
          if-no-files-found: error

