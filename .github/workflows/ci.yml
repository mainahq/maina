name: CI

on:
  push:
    branches: [master, "v1/main"]
  pull_request:
    branches: [master, "v1/**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Dead code (knip, zero findings)
        run: bun run knip

      # Builds core and MCP, then typechecks their published dist/index.d.ts
      # under Node types with skipLibCheck off: no bun:* or drizzle types (#392).
      - name: Published types under Node
        run: bun run check:dts

      - name: Path hygiene (Wave 4 G13 regression guard)
        run: bun run check:paths

      - name: Docs manifest (Wave 4 G11 hand-typed count guard)
        run: bun run docs:check

      # The Spec Kit interop tests (integrations/spec-kit, #333) run the
      # extension and workflow overlay against a stock, pinned Spec Kit CLI.
      - uses: astral-sh/setup-uv@v6

      - name: Install Spec Kit (pinned)
        run: |
          uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@v1.0.12"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Test
        run: bun run test
        env:
          MAINA_REQUIRE_SPECKIT: "1"

  # Code-graph latency budgets (v1 task 5.5, FR-GRAPH-2/4): indexes a pinned
  # ~100k-LOC public repo and fails when a single-file update exceeds 500 ms
  # or a warm query exceeds 200 ms at p95. It runs beside the main job rather
  # than inside it; the checkout is cached under the fetch script's hash,
  # which carries the pinned commit. See packages/core/bench/README.md.
  graph-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache pinned bench repo
        uses: actions/cache@v4
        with:
          path: .cache/bench-repos
          key: graph-bench-repo-${{ hashFiles('scripts/fixtures/fetch-100k-repo.ts') }}

      - name: Fetch pinned bench repo
        run: bun scripts/fixtures/fetch-100k-repo.ts

      - name: Graph bench (fails on budget breach)
        run: bun run bench:graph --json graph-bench.json

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-bench-report
          path: graph-bench.json
          if-no-files-found: ignore
