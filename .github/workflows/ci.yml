name: CI

on:
  push:
    branches: [master, "v1/main"]
  pull_request:
    branches: [master, "v1/**"]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Dead code (knip, zero findings)
        run: bun run knip

      - name: Path hygiene (Wave 4 G13 regression guard)
        run: bun run check:paths

      - name: Docs manifest (Wave 4 G11 hand-typed count guard)
        run: bun run docs:check

      # The Spec Kit interop tests (integrations/spec-kit, #333) run the
      # extension and workflow overlay against a stock, pinned Spec Kit CLI.
      - uses: astral-sh/setup-uv@v6

      - name: Install Spec Kit (pinned)
        run: |
          uv tool install specify-cli --from "git+https://github.com/github/spec-kit.git@v1.0.12"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Test
        run: bun run test
        env:
          MAINA_REQUIRE_SPECKIT: "1"

  # Landing page budget (#360): build the docs site and hold / to the
  # Lighthouse category floors and the byte/timing budget, both written as
  # assertions in packages/docs/lighthouserc.json.
  landing-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: cd packages/docs && bun run build

      - name: Lighthouse budget for /
        working-directory: packages/docs
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.json

  # OS sandbox per worker (v1 task 4B.3, FR-SBX-1..4, ADR 0048): the sandbox
  # tests against the pinned sandbox-runtime on both platforms it supports,
  # with Codex installed for the nested-sandbox spike. The `ci` job has no
  # srt, so there these tests skip and say why; MAINA_REQUIRE_SANDBOX turns
  # that skip into a failure here, so a broken install cannot pass green.
  sandbox:
    name: sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # srt is a Node CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Ubuntu 24.04 strips capabilities from unprivileged user
          # namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The version comes from the adapter, its one source of truth.
      - name: Install sandbox-runtime (pinned) and Codex
        run: |
          SRT="$(bun -e 'import { SANDBOX_RUNTIME as s } from "./packages/harness/src/sandbox/runtime-adapter.ts"; process.stdout.write(`${s.package}@${s.version}`)')"
          npm install -g "$SRT" @openai/codex@0.157.0

      - name: Sandbox tests
        run: bun test packages/harness/src/sandbox
        env:
          MAINA_REQUIRE_SANDBOX: "1"

  # Self-host smoke (v1 task 10.3, FR-REM-4): builds the remote image, runs
  # the compose deployment on its egress-blocked network, runs one PR job
  # with a policy file and a model artifact and fails on any outbound
  # connection but GitHub; also lints and renders the helm chart. The `ci`
  # job has no MAINA_DOCKER_SMOKE, so there this layer skips.
  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Self-host smoke (real image, compose, helm)
        run: bun test packages/remote/deploy
        env:
          MAINA_DOCKER_SMOKE: "1"

  # Code-graph latency budgets (v1 task 5.5, FR-GRAPH-2/4): indexes a pinned
  # ~100k-LOC public repo and fails when a single-file update exceeds 500 ms
  # or a warm query exceeds 200 ms at p95. It runs beside the main job rather
  # than inside it; the checkout is cached under the fetch script's hash,
  # which carries the pinned commit. See packages/core/bench/README.md.
  graph-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache pinned bench repo
        uses: actions/cache@v4
        with:
          path: .cache/bench-repos
          key: graph-bench-repo-${{ hashFiles('scripts/fixtures/fetch-100k-repo.ts') }}

      - name: Fetch pinned bench repo
        run: bun scripts/fixtures/fetch-100k-repo.ts

      - name: Graph bench (fails on budget breach)
        run: bun run bench:graph --json graph-bench.json

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-bench-report
          path: graph-bench.json
          if-no-files-found: ignore
